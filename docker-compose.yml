services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    # Bind mount, not a named volume - pulled models live at ./data/ollama on
    # the host, in plain sight. `docker compose pull && up -d` only ever
    # replaces the ollama binary/image, never this folder, so upgrading never
    # re-downloads or loses a model. Back it up by copying the folder, same
    # as any other file.
    volumes:
      - ./data/ollama:/root/.ollama
    # No host port published, deliberately: openwebui reaches this container
    # over the internal Docker network (http://ollama:11434, set below), and
    # every command in this README uses `docker compose exec ollama ...`,
    # not the host port. Publishing 11434 here conflicts with any machine
    # that already runs Ollama natively (very common - Ollama's own default
    # port is the same 11434) - hit exactly that conflict verifying this
    # bootstrap on a machine with native Ollama already running.

  openwebui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-main}
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      # Stable secret so sessions survive a container restart - without this,
      # OpenWebUI generates a random one on every start and logs everyone out.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # Only matters during the bootstrap window (ENABLE_SIGNUP=true): every
      # signup after the very first becomes role "pending", not "user", and
      # can't chat until an admin approves it. Set to "user" for the bootstrap
      # run, then flip back (or unset) once accounts exist.
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-pending}
      # Reachable from the internet via the Cloudflare Tunnel - set explicitly
      # so generated links (shares, resets) point at the real public hostname
      # instead of an internal container address.
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      # Deliberately its OWN variable, not just "= WEBUI_URL" - CLAUDE.md's
      # own runbook sets WEBUI_URL to the real public domain during local
      # testing (Part A, before the tunnel exists). Confirmed by hitting it
      # for real: with CORS_ALLOW_ORIGIN following WEBUI_URL onto the public
      # domain while testing via http://localhost:3000, a chat message
      # completed on the Ollama/OpenWebUI backend in ~1s (visible in logs)
      # but never rendered in the browser - reverting CORS_ALLOW_ORIGIN to
      # match the browser's actual origin fixed it on retest, full round
      # trip confirmed working. (The browser console still logs a failed
      # `ws://.../socket.io` connection either way, fixed or not - this
      # minimal setup has no reverse proxy in front to carry the websocket
      # upgrade, so OpenWebUI falls back to HTTP polling for real-time
      # updates; that fallback is what's actually working here, and it's
      # fine. Add nginx in front, like local-ai-packaged does, if you want
      # the raw websocket transport instead.) Keep localhost in this list
      # always; add the public domain once you have a tunnel,
      # semicolon-separated, same pattern OpenWebUI itself uses.
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:3000}
      WEBUI_NAME: ${WEBUI_NAME:-Private ChatGPT}
      # A private tool for people you know, no reason to phone home.
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    # Bind mount, not a named volume - chats, accounts, and settings live at
    # ./data/openwebui on the host. Same reasoning as ollama above: pulling a
    # newer openwebui image and recreating the container never touches this
    # folder, so nobody's account or chat history disappears on upgrade.
    volumes:
      - ./data/openwebui:/app/backend/data
    ports:
      - "3000:8080"

  # Token-based Docker connector tunnel: hostname routing lives entirely in
  # the Cloudflare Zero Trust dashboard (Networks -> Tunnels -> your tunnel ->
  # Public Hostname tab), NOT in a local config file. This is deliberate -
  # see README "Two ways to run a Cloudflare Tunnel" for why a local
  # config.yml is the wrong default here.
  #
  # No depends_on: cloudflared should start and stay up independently of
  # openwebui's own health, not get caught in a restart loop if openwebui is
  # briefly unhealthy.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      GOMEMLIMIT: 64MiB
      GOMAXPROCS: "1"
    # cloudflare/cloudflared is a distroless image - no shell, no wget/curl.
    # Use cloudflared's own `tunnel ready` subcommand for the healthcheck -
    # it queries the same process's /ready endpoint, no extra binary needed.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "0.0.0.0:2000", "ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
